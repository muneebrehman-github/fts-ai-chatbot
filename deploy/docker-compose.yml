# Copy this file to the VM app dir (VM_APP_DIR), e.g. /home/muneeb/fts-ai-chatbot/
# Keep secrets in a sibling .env on the VM — do not commit .env.
#
# image: must match GitHub Actions IMAGE_NAME + :latest

services:
  app:
    image: ${DOCKERHUB_USERNAME:-muneeb123}/fts-ai-chat-api:latest
    container_name: fts-ai-chat-api
    restart: unless-stopped
    # Light demo API on a shared tiny VM.
    mem_limit: ${APP_MEM_LIMIT:-448m}
    cpus: ${APP_CPUS:-0.5}
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}
      # Inside listen port. Force SERVER_PORT=PORT so Spring Boot does not
      # pick up host publish port from env_file (SERVER_PORT → server.port).
      PORT: ${PORT:-8080}
      SERVER_PORT: ${PORT:-8080}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-openai/gpt-oss-120b}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
    ports:
      # Host publish port from .env (compose interpolation only; not Spring).
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
