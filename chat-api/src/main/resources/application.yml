server:
  port: ${PORT:8088}

spring:
  application:
    name: fts-ai-chat-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

fts:
  ai:
    chat:
      enabled: true
      groq-api-key: ${GROQ_API_KEY:}
      groq-model: ${GROQ_CHAT_MODEL:openai/gpt-oss-120b}
      gemini-api-key: ${GEMINI_API_KEY:}
      gemini-model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
      system-prompt: |
        You are a helpful website assistant.
        Be concise, friendly, and accurate.
        If you do not know something, say so clearly.
    public:
      sites:
        demo:
          site-key: demo-site
          enabled: true
          # expires-at: 2027-12-31T23:59:59Z   # optional; omit = never expires
          allowed-origins: []
          title: FTS Demo Assistant
          subtitle: Public embed demo
          welcome: Hi — ask me anything. This is the public embed demo.
          placeholder: Type a message...
          launcher-label: AI assistant
          verified-label: Verified FTS demo data
          system-prompt: |
            You are the FTS demo website assistant.
            Be concise and friendly. Keep answers short.
          rate-limit-per-minute: 120
          rate-limit-per-ip-per-minute: 40
        marketing:
          site-key: fts-website-live
          enabled: true
          allowed-origins:
            - https://fast-techsolutions.com
            - https://www.fast-techsolutions.com
            - https://apps.fast-techsolutions.com
            - http://localhost:5173
            - http://localhost:3000
          title: Fast Tech Solutions
          subtitle: AI solutions · ask us anything
          welcome: Hi — ask about our AI chatbots, EdTech, retail & POS, products, or book an AI audit.
          placeholder: Ask about AI, products, or pricing…
          launcher-label: Chat with Fast Tech
          primary-color: "#2F4C7A"
          verified-label: Verified Fast Tech Solutions data
          system-prompt: |
            You are the Fast Tech Solutions website assistant on fast-techsolutions.com.
            Be concise, professional, and friendly. Prefer short answers.

            About Fast Tech Solutions:
            - We design, build and operate production AI for support, education, commerce and operations.
            - AI solutions: AI Chatbots & Voice Agents (RAG, WhatsApp, voice, multilingual), AI for Education,
              AI Retail & Commerce, Smart POS Systems, Agentic Automation, Private LLM & Data Platform.
            - Products: Water Factory Management, AI Chat Bot Platform, Hospital HR System, Dhoondlo, Lets Meet.
            - Services: Mobile apps, web development, custom software, integrations, UI/UX, IT & AI consulting,
              Cloud & DevOps, Security & Compliance.
            - Industries: Retail & F&B, Education, Healthcare, Logistics, Real Estate, Finance.
            - Process: Discovery & AI audit → Prototype in weeks → Build & integrate → Run & improve.
            - Contact: info@fast-techsolutions.com — encourage interested visitors to use the site contact form
              or email for a free AI audit / project brief.
            - Stack we work with includes OpenAI, Gemini, Claude, Llama, LangChain, Pinecone, Supabase,
              Postgres, React, Next.js, Flutter, Node.js, .NET, Python, AWS, Docker.

            If you do not know something (pricing details, timelines not on the site), say so and suggest contacting the team.
            Do not invent case studies, client names, or exact prices.
          rate-limit-per-minute: 120
          rate-limit-per-ip-per-minute: 40
        alfa-pearl:
          site-key: alfa-pearl-portal
          enabled: true
          allowed-origins:
            - http://localhost:8080
            - http://127.0.0.1:8080
          title: Alfa Pearl Assistant
          subtitle: Owner Portal help
          welcome: Hi — ask how to do a task or where to find a menu (orders, production, inventory, HR, accounts, and more).
          placeholder: e.g. how do I create an order?
          launcher-label: Alfa Pearl assistant
          primary-color: "#2FAE45"
          verified-label: Verified Alfa Pearl portal guidance
          system-prompt: |
            You are the Alfa Pearl Owner Portal AI assistant for a bottled water plant.
            Be concise, accurate, and action-oriented. Prefer short bullet steps for how-tos.
            Help users find menus and workflows for orders, production, inventory, HR, accounts, gate pass, GRN, payroll, and reports.
            Never invent stock counts, order totals, payroll figures, or live operational data —
            if you do not know, say so clearly and suggest where in the portal they might look.
            When you know a portal path, mention it.
          rate-limit-per-minute: 120
          rate-limit-per-ip-per-minute: 40

logging:
  level:
    com.fts.aichat: INFO
